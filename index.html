<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC Vocabulary Flashcards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="logo-icon">🔥</span>
                <h1>TOEIC Master</h1>
            </div>
            <p class="subtitle">高效率多益單字卡 - YouTube 教學精華</p>
        </header>

        <section class="controls-card">
            <div class="control-group">
                <label for="apiKey">Gemini API Key</label>
                <input type="password" id="apiKey" placeholder="輸入您的 Gemini API Key (會儲存在本地)">
            </div>
            
            <div class="control-group">
                <label for="scenarioSelect">學習目標情境</label>
                <select id="scenarioSelect" class="styled-select">
                    <option value="TOEIC">多益 (TOEIC) 考試</option>
                    <option value="GEPT">全民英檢中高級 (GEPT)</option>
                    <option value="Daily">日常實用英語</option>
                </select>
            </div>

            <div class="tabs mini-tabs" style="margin-bottom: 1rem;">
                <button class="mini-tab-btn active" data-target="yt-input">自動抓字幕</button>
                <button class="mini-tab-btn" data-target="manual-input">手動輸入單字</button>
            </div>

            <div id="yt-input" class="input-section active-section">
                <div class="control-group">
                    <label for="ytUrl">YouTube 影片網址</label>
                    <div class="input-with-button">
                        <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=...">
                        <button id="generateBtn" class="primary-btn">
                            <span class="btn-text">生成單字卡</span>
                            <div class="loader" id="loader" style="display: none;"></div>
                        </button>
                    </div>
                </div>
            </div>

            <div id="manual-input" class="input-section">
                <div class="control-group">
                    <label for="manualWords">輸入單字 (用逗號或換行分隔)</label>
                    <div class="input-with-button align-bottom">
                        <textarea id="manualWords" rows="3" placeholder="例如: apply, applicant, application"></textarea>
                        <button id="generateManualBtn" class="primary-btn">
                            <span class="btn-text">AI 擴充</span>
                            <div class="loader" id="manualLoader" style="display: none;"></div>
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="history-section" style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1);">
                <h4 style="color: var(--text-secondary); margin-bottom: 0.5rem; font-size: 0.9rem;">📚 已分析過的影片紀錄</h4>
                <ul id="historyList" class="history-list">
                    <!-- History URLs will be injected here -->
                </ul>
            </div>
            
            <div style="margin-top: 1rem; text-align: right; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem;">
                <button id="clearDataBtn" class="danger-btn">🗑️ 清空所有單字庫與紀錄</button>
            </div>
            
            <div id="statusMessage" class="status-message"></div>
        </section>

        <div class="search-bar" style="margin-bottom: 1rem;">
            <input type="text" id="searchInput" placeholder="🔍 搜尋單字或中文意思..." style="width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.2); color: white; font-size: 1rem; outline: none; transition: border-color 0.3s;">
        </div>

        <div class="filters" style="margin-bottom: 2rem;">
            <button class="filter-btn active" data-level="all">全部程度</button>
            <button class="filter-btn" data-level="650">🟢 650+</button>
            <button class="filter-btn" data-level="750">🔷 750+</button>
            <button class="filter-btn" data-level="900">🔶 900+</button>
            
            <span class="divider">|</span>
            
            <button class="filter-status-btn active" data-status="all">全部狀態</button>
            <button class="filter-status-btn" data-status="0">🔴 不熟</button>
            <button class="filter-status-btn" data-status="1">🟡 普通</button>
            <button class="filter-status-btn" data-status="2">🟢 熟悉</button>
        </div>

        <main>
            <div id="words-container" class="card-grid active-section"></div>
        </main>
        
        <footer>
            <p>Generated by Antigravity | Keep Learning!</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
